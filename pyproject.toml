[tool.ruff]
target-version = "py311"
src = ["simpliscribe", "tests"]

[tool.ruff.lint]
# Conservative baseline: syntax/undefined-name class only. Do not enable
# format-on-check or a broad rule set that would force a mass reformat.
select = ["E9", "F63", "F7", "F82", "F401", "E731"]

[tool.ruff.lint.per-file-ignores]
# Re-export required by `uvicorn app:app` and the CI ASGI import check.
"app.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["simpliscribe"]

[tool.coverage.report]
show_missing = true
skip_empty = true
