[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpliscribe"
version = "0.2.0rc1"
description = "Open-source medical prescription review aid, OCR structuring pipeline, and fast vector retrieval engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "SimpliScribe Contributors" }
]
keywords = ["prescription", "medical-ocr", "healthtech", "fastapi", "vector-search", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.12.12",
    "pyarrow==23.0.1",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
local-model = [
    "torch>=2.6",
    "transformers==5.3.0",
]

[project.scripts]
simpliscribe = "app:main"
simpliscribe-benchmark = "simpliscribe.benchmark:main"
simpliscribe-index = "scripts.build_embeddings:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
include-package-data = true
py-modules = ["app"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["simpliscribe*", "scripts*"]
namespaces = true

[tool.setuptools.data-files]
"." = [".env.example", "LICENSE", "THIRD_PARTY_NOTICES.md", "alembic.ini", "A_Z_medicines_dataset_of_India.csv", "all_medicine databased.csv"]
"templates" = ["templates/*.html"]
"templates/partials" = ["templates/partials/*.html"]
"static" = ["static/*.css", "static/*.js", "static/*.svg"]
"alembic" = ["alembic/env.py", "alembic/script.py.mako"]
"alembic/versions" = ["alembic/versions/*.py"]
"data" = ["data/benchmark_cases.sample.json", "data/golden_cases.v1.json", "data/golden_cases.clinician.v1.json"]

[tool.ruff]
target-version = "py311"
src = ["simpliscribe", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "E731"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["simpliscribe"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
