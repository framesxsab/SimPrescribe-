[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpliscribe"
version = "0.2.0"
description = "Open-source medical prescription review aid, OCR structuring pipeline, and fast vector retrieval engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SimpliScribe Contributors" }
]
keywords = ["prescription", "medical-ocr", "healthtech", "fastapi", "vector-search", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "reportlab>=4.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "itsdangerous>=2.1.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "pyarrow>=15.0.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
local-model = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
]

[project.scripts]
simpliscribe = "app:main"
simpliscribe-benchmark = "simpliscribe.benchmark:main"
simpliscribe-index = "scripts.build_embeddings:main"

[tool.ruff]
target-version = "py311"
src = ["simpliscribe", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "E731"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["simpliscribe"]

[tool.coverage.report]
show_missing = true
skip_empty = true
