<a href="#main-content" class="skip-link">Skip to content</a>
<header class="sticky top-0 z-50 border-b border-slate-200/80 dark:border-slate-800 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 min-h-16 py-3 flex flex-wrap items-center justify-between gap-3">
    <a href="/" class="flex items-center gap-3 text-slate-900 dark:text-white">
      <div class="w-9 h-9 bg-primary rounded-xl flex items-center justify-center text-white" aria-hidden="true">
        <span class="material-symbols-outlined text-xl">health_metrics</span>
      </div>
      <span class="text-xl font-bold tracking-tight">{{ app_name }}</span>
    </a>
    <nav class="flex flex-wrap items-center gap-4 md:gap-8" aria-label="Primary">
      <a class="text-sm font-semibold {% if current == 'dashboard' %}text-primary{% else %}text-slate-600 dark:text-slate-400 hover:text-primary{% endif %}" href="/" {% if current == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
      <a class="text-sm font-semibold {% if current == 'history' %}text-primary{% else %}text-slate-600 dark:text-slate-400 hover:text-primary{% endif %}" href="/history" {% if current == 'history' %}aria-current="page"{% endif %}>History</a>
      {% if current == 'dashboard' %}
      <a class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary" href="#recent-activity">Recent Activity</a>
      {% endif %}
    </nav>
    <div class="flex items-center gap-3">
      {% if user %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="rounded-lg border border-slate-300 px-3 py-2 text-xs font-semibold text-slate-700 hover:border-slate-400 dark:border-slate-700 dark:text-slate-200" type="submit">Sign out</button>
      </form>
      {% endif %}
      <span class="hidden lg:inline text-xs font-medium text-slate-500 dark:text-slate-400">OCR + medicine reference datasets</span>
    </div>
  </div>
</header>
