<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} | Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-slate-900">
  <main class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl">
    <p class="text-sm font-bold text-teal-700">Secure review workspace</p>
    <h1 class="mt-2 text-3xl font-black">Sign in to {{ app_name }}</h1>
    <p class="mt-3 text-sm leading-6 text-slate-600">Prescription analyses contain sensitive health information. Access is restricted and audited.</p>
    {% if error %}<p class="mt-5 rounded-xl bg-red-50 p-3 text-sm font-semibold text-red-700" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="mt-7 space-y-5">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label class="block text-sm font-bold">Email<input class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" type="email" name="email" required autocomplete="username"></label>
      <label class="block text-sm font-bold">Password<input class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" type="password" name="password" required autocomplete="current-password"></label>
      <button class="w-full rounded-xl bg-teal-700 px-4 py-3 font-bold text-white hover:bg-teal-800">Sign in</button>
    </form>
  </main>
</body>
</html>
