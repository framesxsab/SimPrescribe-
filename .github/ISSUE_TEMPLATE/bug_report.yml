name: Bug Report
description: Report a reproducible software bug or OCR parsing failure
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include only sanitized diagnostics. Do not attach real prescription images or include patient identifiers, secrets, tokens, cookies, database rows, or private filesystem paths.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this behavior?
      placeholder: |
        1. Go to '/'
        2. Upload synthetic prescription file '...'
        3. Click 'Analyze Prescription'
        4. See unexpected error
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: SimpliScribe version or commit
      description: For a source checkout, include the commit SHA.
      placeholder: "0.2.0rc1 or a commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Operating system, Python version, and browser or Docker details when relevant.
      placeholder: "Windows 11, Python 3.11.15, Chrome 140"
    validations:
      required: true
  - type: textarea
    id: sanitized_logs
    attributes:
      label: Sanitized logs
      description: Remove patient information, prescription text/images, credentials, tokens, cookies, and local personal paths before pasting.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included real patient data, unconsented prescription material, or secrets.
          required: true
